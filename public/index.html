<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Academic Portal | Probation Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/alpinejs" defer></script>
</head>

<body x-data="app()" class="bg-slate-50 text-slate-800 font-sans min-h-screen subpixel-antialiased">

  <main class="max-w-5xl mx-auto px-4 py-12">

    <header class="text-center mb-10">
      <div class="inline-flex items-center justify-center p-3 bg-red-50 text-red-600 rounded-2xl mb-4">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
      </div>
      <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 sm:text-4xl">
        Students on Probation Portal
      </h1>
      <p class="mt-2 text-sm text-slate-500 max-w-md mx-auto">
        System monitoring interface for filtering and generating reports on active academic probations.
      </p>
    </header>

    <section class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 max-w-xl mx-auto mb-10">
      <h2 class="text-lg font-bold text-slate-900 mb-5 flex items-center gap-2">
        <span>🎯</span> Filter Criteria
      </h2>

      <div class="space-y-4">
        <div>
          <label for="year" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Academic
            Year</label>
          <select id="year" x-model="year"
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition duration-200">
            <option value="">-- Select Year --</option>
            <template x-for="y in years" :key="y">
              <option :value="y" x-text="y"></option>
            </template>
          </select>
        </div>

        <div>
          <label for="semester" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Term
            Semester</label>
          <select id="semester" x-model="semester"
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition duration-200">
            <option value="">-- Select Semester --</option>
            <template x-for="s in semesters" :key="s">
              <option :value="s" x-text="s"></option>
            </template>
          </select>
        </div>

        <div class="flex items-center justify-end gap-3 pt-2">
          <button @click="resetFilters()"
            class="px-5 py-2.5 border border-slate-200 text-slate-600 rounded-xl text-sm font-medium hover:bg-slate-50 transition active:scale-95 duration-200">
            Reset
          </button>
          <button @click="fetchStudents()"
            class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-medium transition active:scale-95 shadow-sm shadow-indigo-100 duration-200">
            Fetch Records
          </button>
        </div>
      </div>
    </section>

    <section x-show="students.length > 0" x-transition
      class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden mb-10">
      <div class="px-6 py-4 border-b border-slate-100 bg-slate-50/70 flex items-center justify-between">
        <h3 class="font-bold text-slate-900 flex items-center gap-2">
          <span>📊</span> Probation Records
        </h3>
        <span class="bg-indigo-50 text-indigo-700 text-xs font-semibold px-2.5 py-1 rounded-full"
          x-text="`${students.length} Student(s) Found`"></span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr
              class="bg-slate-100/50 text-slate-500 text-xs font-bold uppercase tracking-wider border-b border-slate-200">
              <th class="py-4 px-6">Student ID</th>
              <th class="py-4 px-6">Student Name</th>
              <th class="py-4 px-6 text-right">Calculated CGPA</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100 text-sm">
            <template x-for="student in students" :key="student.student_id">
              <tr class="hover:bg-slate-50/80 transition duration-150">
                <td class="py-4 px-6 font-mono text-slate-600 font-medium" x-text="student.student_id"></td>
                <td class="py-4 px-6 text-slate-900 font-medium" x-text="student.name"></td>
                <td class="py-4 px-6 text-right">
                  <span class="inline-block px-2.5 py-1 bg-red-50 text-red-700 font-semibold rounded-lg text-xs"
                    x-text="Number(student.cgpa).toFixed(2)"></span>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>

    <section x-show="students.length === 0 && year && semester" x-transition class="max-w-xl mx-auto">
      <div class="rounded-xl bg-amber-50 border border-amber-200/70 p-4 text-center">
        <div class="flex justify-center text-amber-600 mb-2">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <p class="text-sm font-medium text-amber-800">
          No records identified for the selected filters. All students maintain a clear status.
        </p>
      </div>
    </section>

  </main>

  <script>
    function app() {
      return {
        years: [],
        semesters: [],
        year: '',
        semester: '',
        students: [],

        async fetchFilters() {
          try {
            const response = await fetch('http://localhost:3000/api/filters');
            if (!response.ok) throw new Error();
            const data = await response.json();
            this.years = data.years;
            this.semesters = data.semesters;
          } catch (err) {
            console.error('Filter system connection failure:', err);
          }
        },

        async fetchStudents() {
          if (!this.year || !this.semester) {
            return;
          }

          try {
            const response = await fetch(`http://localhost:3000/api/probation?year=${this.year}&semester=${this.semester}`);
            if (!response.ok) throw new Error();
            this.students = await response.json();
          } catch (err) {
            console.error('Query communication system exception:', err);
            this.students = [];
          }
        },

        resetFilters() {
          this.year = '';
          this.semester = '';
          this.students = [];
        },

        init() {
          this.fetchFilters();
        }
      };
    }

    document.addEventListener('alpine:init', () => {
      Alpine.data('app', app);
    });
  </script>

</body>

</html>
