<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Academic Portal | Probation Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
</head>

<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

  <main class="max-w-4xl mx-auto px-4 py-12" id="app">

    <div class="mb-8">
      <span
        class="inline-flex items-center gap-1.5 bg-red-50 text-red-600 border border-red-200 text-xs font-medium px-3 py-1.5 rounded-full mb-3">
        <i class="ti ti-alert-triangle text-sm"></i>
        Academic monitoring
      </span>
      <h1 class="text-3xl font-semibold text-slate-900 mb-1">Probation Tracker</h1>
      <p class="text-sm text-slate-500">Filter and view students flagged for academic probation by term.</p>
    </div>

    <div class="bg-white border border-slate-200 rounded-2xl p-5 mb-6">
      <div class="grid grid-cols-2 gap-3 mb-4">
        <div>
          <label for="year" class="block text-xs text-slate-500 mb-1.5">Academic year</label>
          <select id="year" onchange="updateFetchBtn()"
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
            <option value="">Select year</option>
            <option>2021–22</option>
            <option>2022–23</option>
            <option>2023–24</option>
            <option>2024–25</option>
          </select>
        </div>
        <div>
          <label for="semester" class="block text-xs text-slate-500 mb-1.5">Semester</label>
          <select id="semester" onchange="updateFetchBtn()"
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
            <option value="">Select semester</option>
            <option>Fall</option>
            <option>Spring</option>
            <option>Summer</option>
          </select>
        </div>
      </div>
      <div class="flex justify-end gap-2">
        <button onclick="resetAll()"
          class="px-4 py-2 text-sm text-slate-600 border border-slate-200 rounded-xl hover:bg-slate-50 transition active:scale-95">
          Reset
        </button>
        <button id="fetchBtn" onclick="fetchStudents()" disabled
          class="px-4 py-2 text-sm font-medium text-white bg-slate-900 rounded-xl hover:bg-slate-700 transition active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-1.5">
          <i class="ti ti-database text-base"></i>
          Fetch records
        </button>
      </div>
    </div>

    <div id="statsRow" class="grid grid-cols-3 gap-3 mb-5 hidden">
      <div class="bg-slate-100 rounded-xl p-4">
        <p class="text-xs text-slate-500 mb-1">Students flagged</p>
        <p id="statCount" class="text-2xl font-semibold text-red-600"></p>
      </div>
      <div class="bg-slate-100 rounded-xl p-4">
        <p class="text-xs text-slate-500 mb-1">Average CGPA</p>
        <p id="statAvg" class="text-2xl font-semibold text-slate-900"></p>
      </div>
      <div class="bg-slate-100 rounded-xl p-4">
        <p class="text-xs text-slate-500 mb-1">Lowest CGPA</p>
        <p id="statLow" class="text-2xl font-semibold text-red-600"></p>
      </div>
    </div>

    <div id="resultsArea"></div>

  </main>

  <script>
    let currentStudents = [];

    function updateFetchBtn() {
      const y = document.getElementById('year').value;
      const s = document.getElementById('semester').value;
      document.getElementById('fetchBtn').disabled = !(y && s);
    }

    function resetAll() {
      document.getElementById('year').value = '';
      document.getElementById('semester').value = '';
      currentStudents = [];
      document.getElementById('fetchBtn').disabled = true;
      document.getElementById('resultsArea').innerHTML = '';
      document.getElementById('statsRow').classList.add('hidden');
    }

    async function fetchStudents() {
      const year = document.getElementById('year').value;
      const semester = document.getElementById('semester').value;
      if (!year || !semester) return;

      showLoading();

      try {
        const res = await fetch(`http://localhost:3000/api/probation?year=${encodeURIComponent(year)}&semester=${encodeURIComponent(semester)}`);
        if (!res.ok) throw new Error();
        currentStudents = await res.json();
      } catch {
        currentStudents = [];
      }

      renderResults(year, semester);
    }

    function showLoading() {
      document.getElementById('statsRow').classList.add('hidden');
      document.getElementById('resultsArea').innerHTML = `
        <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden">
          <div class="px-5 py-4 border-b border-slate-100 bg-slate-50 flex items-center gap-2 text-sm font-medium text-slate-700">
            <i class="ti ti-list"></i> Probation records
          </div>
          <div class="py-10 text-center text-sm text-slate-400">
            <span class="inline-block w-4 h-4 border-2 border-slate-200 border-t-slate-600 rounded-full animate-spin mr-2 align-middle"></span>
            Fetching records…
          </div>
        </div>`;
    }

    function renderResults(year, semester) {
      const students = currentStudents;
      const statsRow = document.getElementById('statsRow');

      if (students.length === 0) {
        statsRow.classList.add('hidden');
        document.getElementById('resultsArea').innerHTML = `
          <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-100 bg-slate-50 flex items-center justify-between">
              <span class="flex items-center gap-2 text-sm font-medium text-slate-700"><i class="ti ti-list"></i> Probation records</span>
              <span class="text-xs text-slate-400">${year} · ${semester}</span>
            </div>
            <div class="py-12 text-center">
              <div class="inline-flex items-center justify-center w-10 h-10 bg-slate-100 rounded-full text-slate-400 text-xl mb-3">
                <i class="ti ti-checks"></i>
              </div>
              <p class="text-sm font-medium text-slate-700 mb-1">No probation cases found</p>
              <p class="text-xs text-slate-400">All students maintained satisfactory CGPA this term.</p>
            </div>
          </div>`;
        return;
      }

      const avg = (students.reduce((a, s) => a + parseFloat(s.cgpa), 0) / students.length).toFixed(2);
      const low = Math.min(...students.map(s => parseFloat(s.cgpa))).toFixed(2);

      document.getElementById('statCount').textContent = students.length;
      document.getElementById('statAvg').textContent = avg;
      document.getElementById('statLow').textContent = low;
      statsRow.classList.remove('hidden');

      const rows = students.map(s => {
        const cgpa = parseFloat(s.cgpa);
        const chipClass = cgpa < 1.6
          ? 'bg-red-50 text-red-700 border border-red-200'
          : 'bg-amber-50 text-amber-700 border border-amber-200';
        return `
          <tr class="hover:bg-slate-50 transition">
            <td class="py-3.5 px-5 font-mono text-xs text-slate-500">${s.student_id}</td>
            <td class="py-3.5 px-5 text-sm font-medium text-slate-900">${s.name}</td>
            <td class="py-3.5 px-5 text-right">
              <span class="inline-block px-2.5 py-1 rounded-full text-xs font-semibold ${chipClass}">${cgpa.toFixed(2)}</span>
            </td>
          </tr>`;
      }).join('');

      document.getElementById('resultsArea').innerHTML = `
        <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden">
          <div class="px-5 py-4 border-b border-slate-100 bg-slate-50 flex items-center justify-between">
            <span class="flex items-center gap-2 text-sm font-medium text-slate-700">
              <i class="ti ti-list"></i>
              Probation records
              <span class="bg-red-50 text-red-600 border border-red-200 text-xs font-medium px-2 py-0.5 rounded-full">${students.length} student${students.length !== 1 ? 's' : ''}</span>
            </span>
            <span class="text-xs text-slate-400">${year} · ${semester}</span>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full border-collapse">
              <thead>
                <tr class="bg-slate-50 border-b border-slate-100 text-xs text-slate-500 uppercase tracking-wider">
                  <th class="py-3 px-5 text-left font-medium">Student ID</th>
                  <th class="py-3 px-5 text-left font-medium">Name</th>
                  <th class="py-3 px-5 text-right font-medium">CGPA</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">${rows}</tbody>
            </table>
          </div>
        </div>`;
    }

    async function loadFilters() {
      try {
        const res = await fetch('http://localhost:3000/api/filters');
        if (!res.ok) throw new Error();
        const data = await res.json();

        const yearSel = document.getElementById('year');
        const semSel = document.getElementById('semester');

        yearSel.innerHTML = '<option value="">Select year</option>' +
          data.years.map(y => `<option>${y}</option>`).join('');
        semSel.innerHTML = '<option value="">Select semester</option>' +
          data.semesters.map(s => `<option>${s}</option>`).join('');
      } catch {
        // fallback options already in HTML
      }
    }

    loadFilters();
  </script>

</body>

</html>
